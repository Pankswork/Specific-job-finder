app:
  name: "AI Job Agent"
  version: "0.1.0"

scoring:
  threshold_notify: 60
  threshold_strong: 85
  min_description_length: 100

scheduler:
  interval_hours: 2
  max_jobs_per_run: 50

scrapers:
  indeed:
    enabled: false

  remoteok:
    enabled: true
    max_jobs: 30

  weworkremotely:
    enabled: true
    max_jobs: 15

  linkedin:
    enabled: false
    query: "DevOps Engineer"
    location: "India"

  hirist:
    enabled: false
    query: "devops"

  ambitionbox:
    enabled: false
    query: "devops"
    location: "bangalore"

  builtin:
    enabled: false
    query: "devops-engineer"

  jobsora:
    enabled: true
    query: "devops"
    location: "Bangalore"
    max_jobs: 20

  jooble:
    enabled: false
    query: "devops"
    location: "India"

  jobslooker:
    enabled: false
    query: "devops"
    location: "bangalore"

  foundit:
    enabled: false
    query: "devops"
    location: "bangalore"

notifications:
  telegram:
    enabled: true
  summary:
    include_skipped: false
    max_details: 10
