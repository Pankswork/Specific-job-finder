app:
  name: "AI Job Agent"
  version: "0.1.0"

scoring:
  threshold_notify: 60
  threshold_strong: 85
  min_description_length: 100
  max_job_age_days: 1

scheduler:
  interval_hours: 2

scrapers:
  indeed:
    enabled: false

  remoteok:
    enabled: true
    max_jobs: 30

  weworkremotely:
    enabled: true
    max_jobs: 15

  linkedin:
    enabled: true
    query: "DevOps"
    location: "India"

  linkedin_posts:
    enabled: true
    max_posts: 20

  hirist:
    enabled: true
    query: "devops"

  ambitionbox:
    enabled: false
    query: "devops"
    location: "bangalore"

  builtin:
    enabled: false
    query: "devops-engineer"

  jobsora:
    enabled: true
    query: "devops"
    location: "India"
    max_jobs: 20

  jooble:
    enabled: false
    query: "devops"
    location: "India"

  jobslooker:
    enabled: false
    query: "devops"
    location: "bangalore"

  adzuna:
    enabled: true
    query: "devops"
    where: "India"
    max_jobs: 20
    # app_id and app_key from ADZUNA_APP_ID / ADZUNA_API_KEY env vars

  foundit:
    enabled: false
    # blocked by Akamai CDN, requires residential proxy to bypass
    query: "devops"
    location: "bangalore"

notifications:
  telegram:
    enabled: true
  summary:
    include_skipped: false
    max_details: 10
